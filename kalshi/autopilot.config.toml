# Config used by the scheduled GitHub Actions autopilot (.github/workflows/kalshi-autopilot.yml).
# Credentials come from environment variables / secrets, never from this file.
# Edit the numbers here to change how the bot behaves; the change takes effect on the next run.

[risk]                            # per-order rails, shared with manual commands (cents; 0 disables)
max_order_cost_cents = 1000       # $10 worst case per order
max_position_contracts = 20       # per market
max_open_orders = 15
max_daily_spend_cents = 0         # disabled: the ledger file does not survive between Actions runs;
                                  # the autopilot's exposure cap below does the job instead
min_price_cents = 5
max_price_cents = 95

[autopilot]
min_volume = 1000
max_spread_cents = 8
min_hours_to_close = 6
max_days_to_close = 14
min_price_cents = 5
max_price_cents = 95
include_series = []
exclude_series = []
exclude_keywords = []

model = "claude-opus-5"
max_research_per_pass = 4         # roughly $0.50 to $2 of Claude usage per run (6 runs a day)
max_searches_per_market = 8
research_ttl_hours = 12
min_confidence = "medium"

edge_cents = 10
max_contracts = 10
max_total_exposure_cents = 10000  # $100 total at risk
min_balance_cents = 2500          # stop buying below $25 cash

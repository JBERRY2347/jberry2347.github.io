# Config used by the scheduled GitHub Actions autopilot (.github/workflows/kalshi-autopilot.yml).
# Credentials come from environment variables / secrets, never from this file.
# Edit the numbers here to change how the bot behaves; the change takes effect on the next run.

[risk]                            # per-order rails, shared with manual commands (cents; 0 disables)
max_order_cost_cents = 1000       # $10 worst case per order
max_position_contracts = 20       # per market
max_open_orders = 15
max_daily_spend_cents = 0         # disabled: the ledger file does not survive between Actions runs;
                                  # the autopilot's exposure cap below does the job instead
min_price_cents = 5
max_price_cents = 95

[autopilot]
min_volume = 1000
max_spread_cents = 8
min_hours_to_close = 6
max_days_to_close = 14
min_price_cents = 5
max_price_cents = 95
include_series = []
exclude_series = []
exclude_keywords = []

model = "claude-sonnet-5"         # ~40% of Opus's price per token; "claude-opus-5" for more careful reasoning
max_research_per_pass = 3
max_searches_per_market = 6       # each search ~$0.01 plus the pages it reads; this is most of the cost
research_effort = "medium"        # "high" roughly doubles the cost per market
max_research_usd_per_day = 3.0    # hard cap on estimated Claude spend per UTC day
research_ttl_hours = 12
min_confidence = "medium"
max_price_drift_cents = 15        # if the market moved further than this since research, the estimate is stale

# cross-exchange signal: compare each candidate with the closest Polymarket question (read-only, no login)
polymarket_enabled = true
min_cross_exchange_gap_cents = 8  # research markets where the two exchanges disagree by this much first
min_cross_match_similarity = 0.5  # wording similarity needed to treat two questions as the same event

edge_cents = 10
max_contracts = 10
max_total_exposure_cents = 10000  # $100 total at risk
min_balance_cents = 2500          # stop buying below $25 cash

[autopilot.demo]                  # overrides applied only when KALSHI_ENV=demo
# The demo exchange is thinly traded (a busy market has ~200 contracts of volume and
# wide spreads), so loosen the liquidity filters there. These never apply to prod.
min_volume = 20
max_spread_cents = 30
max_research_per_pass = 2
# Play money: trade small edges so the order path gets exercised and fills can be inspected.
# Demo P&L therefore says little about real performance; judge the Brier score instead.
edge_cents = 3
min_balance_cents = 500           # use nearly the whole $100 demo balance
